<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muhammad Samay</title>
<style>
  :root{--black:#0b0b0d;--black2:#17171b;--red:#d71920;--red-dark:#8f0d12;--text:#f2eeee;--muted:#c9c0c0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;color:var(--text);line-height:1.7;
    font-family:Georgia,'Times New Roman',serif;
    background:var(--black);
    background-image:radial-gradient(circle at 100% 0,rgba(215,25,32,.35) 0,transparent 45%),
                     radial-gradient(circle at 0 100%,rgba(143,13,18,.35) 0,transparent 50%);
    background-attachment:fixed;
  }
  .hero{background:linear-gradient(160deg,var(--red) 0%,var(--red-dark) 100%);text-align:center;padding:40px 22px 64px;
    border-bottom-left-radius:50% 28px;border-bottom-right-radius:50% 28px}
  .avatar{
    width:150px;height:150px;border-radius:50%;margin:0 auto 20px;overflow:hidden;
    background:var(--black);color:var(--red);border:5px solid var(--text);
    box-shadow:0 0 0 6px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;font-size:3.2rem;font-weight:bold;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.15}
  .tag{display:inline-block;margin-top:14px;padding:6px 16px;border:1.5px solid var(--text);border-radius:99px;font-size:.92rem}

  main{max-width:620px;margin:-30px auto 0;padding:0 18px 50px}
  .box{background:var(--black2);border:2px solid var(--red);border-radius:18px;padding:22px;margin-bottom:18px;
    box-shadow:6px 6px 0 var(--red-dark)}
  h2{color:var(--red);font-size:1.25rem;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  h2::before{content:"";width:10px;height:10px;background:var(--red);border-radius:50%}
  p{font-size:1.03rem;color:var(--muted)}
  .hobi{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .hobi span{background:var(--red);color:var(--text);padding:8px 18px;border-radius:99px;font-size:1rem}
  .motivasi{background:linear-gradient(160deg,var(--red-dark),var(--black2));}
  .motivasi h2{color:var(--text)} .motivasi h2::before{background:var(--text)}
  .motivasi p{color:var(--text)}
  .motivasi p+p{margin-top:10px}
  .motivasi em{color:#ffb3b6}
  footer{text-align:center;padding:10px 0 30px;color:var(--muted);font-size:.85rem}
</style>
</head>

  <div class="tag">Informatika · Semester 3</div>
</header>

  </div>

    <h2>Hobi</h2>
    <div class="hobi"><span>Memancing</span></div>
